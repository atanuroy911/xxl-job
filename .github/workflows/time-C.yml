name: optcd-time-C

on:
- workflow_dispatch

jobs:
  build:

    runs-on:

    - self-hosted
    - optcd
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: 'mvn: go-offline (untimed)'
      run: mvn -B -q dependency:go-offline || true
    - name: 'mvn: Build with Maven'
      run: mvn -B package --file pom.xml
